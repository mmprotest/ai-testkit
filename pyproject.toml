[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-testkit"
version = "0.1.0"
description = "ai-testkit: evaluation toolkit for LLM applications"
authors = [{name = "AI Testkit", email = "support@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.9",
    "pydantic>=2",
    "rich>=13",
    "jinja2>=3",
    "orjson>=3",
    "numpy>=1.24",
    "pandas>=1.5",
    "httpx>=0.25",
    "tqdm>=4",
    "jsonschema>=4",
    "regex>=2023",
    "markdown-it-py>=3",
    "yattag>=1.14",
]

[project.optional-dependencies]
metrics = [
    "rouge-score>=0.1",
    "sacrebleu>=2.3",
    "bert-score>=0.3",
    "sentence-transformers>=2.2",
]
safety = [
    "detoxify>=0.5",
]

dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
    "black>=23",
    "mypy>=1.6",
    "build>=1",
    "twine>=4",
]

[project.scripts]
ait = "ai_testkit.cli:app"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

